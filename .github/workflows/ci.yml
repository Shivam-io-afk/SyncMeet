name: CI

on:
  push:
    branches:
      - main
      - backend-improve
  pull_request:
    branches:
      - main
      - backend-improve

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Lint, Check, and Test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Run server syntax and production bundle build check
        run: npm run check

      - name: Run automated test suite
        run: npm test

